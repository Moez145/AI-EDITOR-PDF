<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocuAI | Sign Up</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="{{url_for('static',path='css/sign_up.css')}}">

</head>

<body>

    <div class="background"></div>

    <section class="signup-section">

        <div class="signup-card">

            <h2>Create your DocuAI account</h2>

            <p class="subtitle">
                Start working smarter with your PDFs today
            </p>

            <!-- Google Button -->

            <button class="google-btn">

                <div class="google-left">

                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">

                    <span>Continue with Google</span>

                </div>

            </button>

            <!-- Divider -->

            <div class="divider">

                <span>or</span>

            </div>

            <!-- Signup Form -->

            <form id="signupForm">
                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required>

                </div>

                <div class="form-group">

                    <label>Email address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required>

                </div>

                <div class="form-group password-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required>

                        <button type="button" class="toggle-password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>

                <button class="continue-btn" type="submit">

                    Continue

                    <i class="fa-solid fa-play"></i>

                </button>

            </form>

            <!-- Login -->

            <div class="signin">

                Already have an account?

                <a href="/sign_in">Sign in</a>

            </div>

            <!-- Footer -->

            <div class="development">

                Development mode

            </div>

        </div>

    </section>

    <!-- Password Toggle -->

    <script>

        const password=document.getElementById("password");

        const toggle=document.querySelector(".toggle-password");

        toggle.addEventListener("click",()=>{

            if(password.type==="password"){

                password.type="text";

                toggle.innerHTML='<i class="fa-regular fa-eye-slash"></i>';

            }

            else{

                password.type="password";

                toggle.innerHTML='<i class="fa-regular fa-eye"></i>';

            }

        });

    </script>
<script src="{{url_for('static',path='js/signup.js')}}"></script>
</body>

</html>
